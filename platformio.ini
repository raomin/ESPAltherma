; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = web-esp32

; Settings shared by all ESP32 boards.
; espressif32@7.0.1 = Arduino core 2.0.17. Core 3.3.12 was tried in November 2026: on a classic ESP32 it leaves
; 22 KB less heap and makes the image 200 KB larger (and its M5StickC variant has another name).
[esp32_common]
platform = espressif32@7.0.1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; C++ exceptions off (with -fno-exceptions in the build flags of web_common): nothing here or in the libraries
; catches one, and their unwind tables cost 74 KB of flash on an M5StickC, 87 KB on a C6. What would throw
; (a failed allocation) stops the board the same way as before.
build_unflags = -fexceptions
; Uncomment this line to allow for remote upgrade. If name resolution does not work for you, replace with the IP of ESPAltherma
; upload_port = ESPAltherma.local
; Uncomment this line if you want to define the protocol. Autodetected otherwise.
; upload_protocol = espota
lib_deps =
	PubSubClient
	bblanchon/ArduinoJson@^7.2.0
	ESP32Async/AsyncTCP@^3.5.0
	ESP32Async/ESPAsyncWebServer@^3.12.1

; M5 boards. Exact versions: these two libraries are a tenth of the image, and a new release changed its size
; by 24 KB between two builds of the same code.
[m5_common]
extends = esp32_common
lib_deps =
	${esp32_common.lib_deps}
	m5stack/M5Unified@0.3.0
	m5stack/M5GFX@0.3.0

; One firmware per board, configured at runtime (web interface). The web installer (flasher/) installs them.
; Installed over USB the first time, so they can use the larger app partitions.
[web_common]
board_build.partitions = min_spiffs.csv
; Heat pump reports (telemetry/): the checkbox at the model confirmation appears when this is set
; CONFIG_ASYNC_TCP_STACK_SIZE: the stack of the web server's task, 16 KB in the library. The requests use 3 KB of
; it at most (/api/heap tells), and on core 3 an M5StickC needs that memory back for its HTTPS connections.
build_flags = -D TELEMETRY_URL=\"https://espaltherma-telemetry.pages.dev/api/report\" -fno-exceptions -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
; Regenerate include/catalog_data.h and include/webui_data.h when the definition files or the web page change,
; + the single image flashed at offset 0 by the web installer (firmware-factory.bin)
extra_scripts =
	pre:scripts/gen_catalog.py
	pre:scripts/build_web.py
	post:scripts/merge_firmware.py
; USB port of the chip as console, UART0 mirrored (see SECOND_CONSOLE in include/board.h)
usb_console_flags = -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

[env:web-esp32]
extends = esp32_common, web_common
board = esp32doit-devkit-v1

[env:web-esp32c3]
extends = esp32_common, web_common
board = esp32-c3-devkitm-1
build_flags = ${web_common.build_flags} ${web_common.usb_console_flags}

; Arduino core 3 built for ESPAltherma (the pioarduino platform rebuilds the IDF libraries with these settings, about
; 3 minutes per board). Measured on an ESP32-S3 (#705), against the stock core 3: as much heap free at rest as on
; core 2 (201 KB instead of 168 KB), an HTTPS call takes 33 KB instead of 54 KB, and the image is 139 KB smaller.
; - TLS: dynamic buffers (send 4 KB, receive 16 KB taken only while a record is read); DTLS off, which they need;
;   the server's certificate not kept, as nothing checks it (setInsecure).
; - Core 2's stacks for the timer, IPC and lwIP tasks (core 3 has 8, 2 and 4 KB instead of 4, 1 and 2.5 KB).
; - Off: Bluetooth, Zigbee, Thread, IPv6, PPP, Wi-Fi FTM, WPA2-Enterprise, WPA3-OWE (WPA3-SAE and the access point stay),
;   and the interrupt handlers of drivers ESPAltherma does not use kept out of IRAM, which shares its SRAM with the
;   heap; the components it never calls are not linked.
; The rebuild looks for the partition table in the project only: partitions/min_spiffs.csv is the framework's own.
[core3_lean]
board_build.partitions = partitions/min_spiffs.csv
custom_sdkconfig =
	'# CONFIG_MBEDTLS_SSL_PROTO_DTLS is not set'
	CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
	CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA=y
	CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT=y
	'# CONFIG_MBEDTLS_SSL_KEEP_PEER_CERTIFICATE is not set'
	CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
	CONFIG_ESP_IPC_TASK_STACK_SIZE=1024
	CONFIG_LWIP_TCPIP_TASK_STACK_SIZE=2560
	'# CONFIG_BT_ENABLED is not set'
	'# CONFIG_ZB_ENABLED is not set'
	'# CONFIG_OPENTHREAD_ENABLED is not set'
	'# CONFIG_LWIP_IPV6 is not set'
	'# CONFIG_LWIP_PPP_SUPPORT is not set'
	'# CONFIG_ESP_WIFI_FTM_ENABLE is not set'
	'# CONFIG_ESP_WIFI_ENTERPRISE_SUPPORT is not set'
	'# CONFIG_ESP_WIFI_ENABLE_WPA3_OWE_STA is not set'
	'# CONFIG_RMT_TX_ISR_HANDLER_IN_IRAM is not set'
	'# CONFIG_RMT_RX_ISR_HANDLER_IN_IRAM is not set'
	'# CONFIG_RMT_ENCODER_FUNC_IN_IRAM is not set'
	'# CONFIG_MCPWM_ISR_HANDLER_IN_IRAM is not set'
	'# CONFIG_I2S_ISR_IRAM_SAFE is not set'
	'# CONFIG_SPI_SLAVE_ISR_IN_IRAM is not set'
	'# CONFIG_GPTIMER_ISR_HANDLER_IN_IRAM is not set'
	'# CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_ENABLE is not set'
	CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_SILENT=y
custom_component_remove =
	espressif/esp_rainmaker
	espressif/rmaker_common
	espressif/rmaker_cmd_resp
	espressif/rmaker_common_events
	espressif/rmaker_console
	espressif/rmaker_system_ctrl
	espressif/rmaker_time_sync
	espressif/rmaker_work_queue
	espressif/esp_insights
	espressif/esp_diagnostics
	espressif/esp_diag_data_store
	espressif/esp-zboss-lib
	espressif/esp-zigbee-lib
	espressif/esp-sr
	espressif/esp-dl
	espressif/dl_fft
	espressif/esp-dsp
	espressif/esp_modem
	espressif/esp-modbus
	espressif/network_provisioning
	espressif/qrcode
	espressif/esp_new_jpeg
	espressif/esp_schedule
	espressif/esp_daylight
	espressif/esp_secure_cert_mgr
	chmorgan/esp-libhelix-mp3

; The C6 needs Arduino core 3.x, which the espressif32 platform does not ship: use the pioarduino one. From 55.03.313
; on: 55.03.312-1 refuses its own PlatformIO when it rebuilds the IDF libraries ("depends on PlatformIO Core >=6.2.0").
[env:web-esp32c6]
extends = esp32_common, web_common, core3_lean
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32-c6-devkitc-1
; The board definition says 8 MB, but C6 modules come with 4 MB too (ESP32-C6-WROOM-1-N4): an image built for 8 MB
; stops at the flash probe on them (#628). Built for 4 MB, it runs on both; the partitions already fit in 4 MB.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags = ${web_common.build_flags} ${web_common.usb_console_flags}

[env:web-esp32s3]
extends = esp32_common, web_common
board = esp32-s3-devkitc-1
; Runs on every S3 module (4MB and more)
board_upload.flash_size = 4MB
build_flags = ${web_common.build_flags} ${web_common.usb_console_flags}

[env:web-m5stickc]
extends = m5_common, web_common
board = m5stick-c

[env:web-m5stickcplus]
extends = m5_common, web_common
board = m5stick-c
build_flags = ${web_common.build_flags} -D ARDUINO_M5Stick_C_Plus

[env:web-m5stickcplus2]
extends = m5_common, web_common
board = m5stick-c
build_flags = ${web_common.build_flags} -D ARDUINO_M5Stick_C_Plus2

[env:web-m5stack-tough]
extends = m5_common, web_common
board = m5stack-core2
; 16MB flash: its default partitions are large enough
board_build.partitions = default_16MB.csv
build_flags = ${web_common.build_flags} -D ARDUINO_M5Stack_Tough

; No screen: built like a plain ESP32 (no M5Unified), X10A on the Grove port
[env:web-m5stack-atom]
extends = esp32_common, web_common
board = m5stack-atom

; Wired Ethernet boards (PHY settings from the board variant). WiFi stays available as a backup.
[env:web-wt32-eth01]
extends = esp32_common, web_common
board = wt32-eth01
build_flags = ${web_common.build_flags} -D HAS_ETHERNET

[env:web-esp32-poe]
extends = esp32_common, web_common
board = esp32-poe
build_flags = ${web_common.build_flags} -D HAS_ETHERNET

[env:native]
# Used to run unit test; g++ must be in PATH.
platform = native
build_flags = "-std=c++11"
lib_deps = bblanchon/ArduinoJson@^7.2.0
