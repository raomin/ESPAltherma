; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = web-esp32

; Settings shared by all ESP32 boards.
; Keep espressif32@7.0.1 (Arduino core 2.0.17): core 3.x renamed the M5 board variants.
[esp32_common]
platform = espressif32@7.0.1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Uncomment this line to allow for remote upgrade. If name resolution does not work for you, replace with the IP of ESPAltherma
; upload_port = ESPAltherma.local
; Uncomment this line if you want to define the protocol. Autodetected otherwise.
; upload_protocol = espota
lib_deps =
	PubSubClient
	bblanchon/ArduinoJson@^7.2.0
	ESP32Async/AsyncTCP@^3.5.0
	ESP32Async/ESPAsyncWebServer@^3.12.1

; M5 boards
[m5_common]
extends = esp32_common
lib_deps =
	${esp32_common.lib_deps}
	M5Unified

; One firmware per board, configured at runtime (web interface). The web installer (flasher/) installs them.
; Installed over USB the first time, so they can use the larger app partitions.
[web_common]
board_build.partitions = min_spiffs.csv
; Opt-in heat pump reports (telemetry/): the checkbox at the model confirmation appears when this is set
build_flags = -D TELEMETRY_URL=\"https://espaltherma-telemetry.pages.dev/api/report\"
; Regenerate include/catalog_data.h and include/webui_data.h when the definition files or the web page change,
; + the single image flashed at offset 0 by the web installer (firmware-factory.bin)
extra_scripts =
	pre:scripts/gen_catalog.py
	pre:scripts/build_web.py
	post:scripts/merge_firmware.py
; USB port of the chip as console, UART0 mirrored (see SECOND_CONSOLE in include/board.h)
usb_console_flags = -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

[env:web-esp32]
extends = esp32_common, web_common
board = esp32doit-devkit-v1

[env:web-esp32c3]
extends = esp32_common, web_common
board = esp32-c3-devkitm-1
build_flags = ${web_common.build_flags} ${web_common.usb_console_flags}

; The C6 needs Arduino core 3.x, which the espressif32 platform does not ship: use the pioarduino one
[env:web-esp32c6]
extends = esp32_common, web_common
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
build_flags = ${web_common.build_flags} ${web_common.usb_console_flags}

[env:web-esp32s3]
extends = esp32_common, web_common
board = esp32-s3-devkitc-1
; Runs on every S3 module (4MB and more)
board_upload.flash_size = 4MB
build_flags = ${web_common.build_flags} ${web_common.usb_console_flags}

[env:web-m5stickc]
extends = m5_common, web_common
board = m5stick-c

[env:web-m5stickcplus]
extends = m5_common, web_common
board = m5stick-c
build_flags = ${web_common.build_flags} -D ARDUINO_M5Stick_C_Plus

[env:web-m5stickcplus2]
extends = m5_common, web_common
board = m5stick-c
build_flags = ${web_common.build_flags} -D ARDUINO_M5Stick_C_Plus2

[env:web-m5stack-tough]
extends = m5_common, web_common
board = m5stack-core2
; 16MB flash: its default partitions are large enough
board_build.partitions = default_16MB.csv
build_flags = ${web_common.build_flags} -D ARDUINO_M5Stack_Tough

; Wired Ethernet boards (PHY settings from the board variant). WiFi stays available as a backup.
[env:web-wt32-eth01]
extends = esp32_common, web_common
board = wt32-eth01
build_flags = ${web_common.build_flags} -D HAS_ETHERNET

[env:web-esp32-poe]
extends = esp32_common, web_common
board = esp32-poe
build_flags = ${web_common.build_flags} -D HAS_ETHERNET

[env:native]
# Used to run unit test; g++ must be in PATH.
platform = native
build_flags = "-std=c++11"
